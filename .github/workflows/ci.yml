name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0-dev.1756+613c03321

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: formatting
      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"
      - name: Check formatting
        run: zig fmt --check build.zig src tests tools

  core-tests:
    name: Core tests (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize:
          - debug
          - safe
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: core-${{ matrix.optimize }}
      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"
      - name: Run core test suite
        run: zig build test -Dexternal-backends=false -Doptimize=${{ matrix.optimize }}

  optional-backends:
    name: Optional backend (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all
            options: -Dexternal-backends=true
          - name: ziggy
            options: -Dexternal-backends=false -Dbackend-ziggy=true
          - name: ziggy-schema
            options: -Dexternal-backends=false -Dbackend-ziggy-schema=true
          - name: scripty
            options: -Dexternal-backends=false -Dbackend-scripty=true
          - name: html
            options: -Dexternal-backends=false -Dbackend-html=true
          - name: xml
            options: -Dexternal-backends=false -Dbackend-xml=true
          - name: css
            options: -Dexternal-backends=false -Dbackend-css=true
          - name: superhtml
            options: -Dexternal-backends=false -Dbackend-superhtml=true
          - name: markdown
            options: -Dexternal-backends=false -Dbackend-markdown=true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: optional-${{ matrix.name }}
      - name: Verify Zig version
        run: test "$(zig version)" = "${ZIG_VERSION}"
      - name: Run optional backend tests
        run: zig build test-optional -Doptimize=safe ${{ matrix.options }}
